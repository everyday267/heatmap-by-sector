<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>업종 밀도 지도</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>업종 밀도 지도</h1>
      <div class="brand-row">
        <select id="dataset" aria-label="데이터셋"></select>
        <span id="dataset-badge" class="badge-data"></span>
      </div>
    </div>

    <form id="query-form" class="controls" autocomplete="off">
      <label class="field">
        <span>업종</span>
        <select id="category" required></select>
      </label>
      <label class="field" id="age-field" hidden>
        <span>타깃 연령</span>
        <select id="age"></select>
      </label>
      <label class="field field-grow">
        <span>주소</span>
        <input id="address" list="address-suggestions" placeholder="예) 강남역, 역삼동 123, 37.4979,127.0276" required />
        <datalist id="address-suggestions"></datalist>
      </label>
      <label class="field field-radius">
        <span>반경 <output id="radius-label">500m</output></span>
        <input id="radius" type="range" min="100" max="2000" step="100" value="500" />
      </label>
      <button type="submit">분석</button>
    </form>
  </header>

  <main class="layout">
    <section class="map-wrap">
      <div id="map" aria-label="지도"></div>
      <div class="map-hint">지도를 클릭하면 그 지점을 중심으로 다시 분석합니다</div>
    </section>

    <aside class="panel" aria-live="polite">
      <p id="message" class="message" hidden></p>

      <div id="result" hidden>
        <p id="place-label" class="place-label"></p>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">반경 내 업소</span>
            <span class="stat-value"><b id="stat-count">–</b>곳</span>
          </div>
          <div class="stat">
            <span class="stat-label">밀도</span>
            <span class="stat-value"><b id="stat-density">–</b>/㎢</span>
          </div>
          <div class="stat">
            <span class="stat-label">경쟁 강도</span>
            <span id="stat-level" class="level">–</span>
            <span id="stat-rank" class="stat-sub"></span>
          </div>
        </div>

        <div id="demand-block" hidden>
        <label id="pop-basis-row" class="basis-row" hidden>
          <span>인구 기준</span>
          <select id="pop-basis"></select>
        </label>
        <div id="demand" class="stats stats-demand" hidden>
          <div class="stat">
            <span class="stat-label" id="pop-label">반경 내 인구</span>
            <span class="stat-value"><b id="pop-count">–</b>명</span>
          </div>
          <div class="stat">
            <span class="stat-label">1곳당 인구</span>
            <span class="stat-value"><b id="pop-per-store">–</b>명</span>
          </div>
          <div class="stat">
            <span class="stat-label">인구 대비 경쟁</span>
            <span id="pop-level" class="level">–</span>
            <span id="pop-rank" class="stat-sub"></span>
          </div>
        </div>
        <p id="demand-note" class="demand-note" hidden></p>
        </div>

        <p id="headline" class="headline"></p>
        <p id="advice" class="advice"></p>

        <h2><span id="compare-title">이 위치의 업종별 비교</span> <small>막대 색 = 경쟁 강도</small></h2>
        <ol id="compare" class="compare"></ol>

        <h2>가까운 업소 <small id="nearest-count"></small></h2>
        <ol id="nearest" class="nearest"></ol>
      </div>

      <footer class="panel-foot">
        <div class="legend">
          <span>히트맵: 주변 <output id="context-label">2km</output> 동일 업종 분포</span>
          <span class="legend-bar" aria-hidden="true"></span>
          <span class="legend-ends"><span>드묾</span><span>밀집</span></span>
        </div>
        <p>경쟁 강도: 이 데이터 범위에서 상가가 있는 100m 칸들과 같은 반경·같은 업종 개수를 비교한 순위. 상위 10% 매우높음 · 10–30% 높음 · 30–70% 보통 · 하위 30% 낮음</p>
        <p id="data-source"></p>
        <p id="pop-source"></p>
      </footer>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-heat/leaflet-heat.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
