# 상가(상권)정보, 행정동별 주민등록 인구, 서울 생활인구를 GitHub Actions에서 받아 data/에 커밋한다.
# 인증키는 저장소 Settings › Secrets and variables › Actions에서만 읽는다:
#   DATA_GO_KR_SERVICE_KEY (공공데이터포털: 상가·주민등록 인구), SEOUL_OPENAPI_KEY (서울 열린데이터광장: 생활인구, 선택)
#
# 실행 시점
#   - 수동: Actions 탭 › "Fetch sangga data" › Run workflow
#   - 수집 로직(스크립트·이 파일)이 바뀐 커밋이 push될 때
#   - 분기마다(상가정보 갱신 주기) 기본 브랜치에서

name: Fetch sangga data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-sangga.yml"
      - "scripts/fetch-sangga.mjs"
      - "scripts/lib/sangga.mjs"
      - "scripts/fetch-population.mjs"
      - "scripts/lib/population.mjs"
      - "scripts/fetch-livepop.mjs"
      - "scripts/lib/livepop.mjs"
  schedule:
    - cron: "0 21 5 1,4,7,10 *" # 1·4·7·10월 6일 06:00 KST

permissions:
  contents: write

concurrency:
  group: fetch-sangga-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash # 명시해야 -o pipefail이 켜져 `수집 | tee` 실패가 묻히지 않는다
    steps:
      - name: 인증키 확인
        id: key
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "::warning::DATA_GO_KR_SERVICE_KEY 시크릿이 없어 수집을 건너뜁니다. Settings › Secrets and variables › Actions에 등록한 뒤 다시 실행하세요."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22

      - name: 테스트
        if: steps.key.outputs.present == 'true'
        run: npm test

      # 공공데이터포털 접속이 일시적으로 안 될 수 있다. 실패해도 이전에 커밋된 상가 데이터로 다음 단계를 진행한다.
      - name: 길음2동 수집
        id: sangga
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          npm run --silent fetch:gileum2 2>&1 | tee fetch.log
          { echo '### 상가정보 수집 결과'; echo '```'; tail -n 5 fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 상가 수집 실패 알림
        if: steps.key.outputs.present == 'true' && steps.sangga.outcome == 'failure'
        run: |
          git checkout -- data/ # 반쯤 쓴 파일이 있으면 이전 커밋 상태로
          echo "::warning::상가정보 수집에 실패해 이전에 커밋된 상가 데이터로 진행합니다. 로그의 '상가정보 수집 결과'를 확인하세요."
          { echo '### ⚠️ 상가정보 수집 실패'; echo '```'; tail -n 15 fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 인구는 별도 활용신청(15108072)이 필요하다. 실패해도 상가 데이터는 커밋한다.
      - name: 길음2동 인구 수집
        id: population
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          npm run --silent fetch:gileum2:population 2>&1 | tee population.log
          { echo '### 인구 수집 결과'; echo '```'; tail -n 8 population.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 인구 수집 실패 알림
        if: steps.key.outputs.present == 'true' && steps.population.outcome == 'failure'
        run: |
          echo "::warning::인구 수집에 실패했습니다(상가 데이터는 정상 커밋). 로그의 '인구 수집 결과'를 확인하세요."
          { echo '### ⚠️ 인구 수집 실패'; echo '```'; tail -n 20 population.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 생활인구는 서울 열린데이터광장 키가 따로 필요하다. 키가 없거나 실패해도 나머지는 커밋한다.
      - name: 길음2동 생활인구 수집
        id: livepop
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: |
          if [ -z "$SEOUL_OPENAPI_KEY" ]; then
            echo "::warning::SEOUL_OPENAPI_KEY 시크릿이 없어 생활인구 수집을 건너뜁니다."
            exit 0
          fi
          npm run --silent fetch:gileum2:livepop 2>&1 | tee livepop.log
          { echo '### 생활인구 수집 결과'; echo '```'; tail -n 8 livepop.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 생활인구 수집 실패 알림
        if: steps.key.outputs.present == 'true' && steps.livepop.outcome == 'failure'
        run: |
          echo "::warning::생활인구 수집에 실패했습니다(다른 데이터는 정상 커밋). 로그의 '생활인구 수집 결과'를 확인하세요."
          { echo '### ⚠️ 생활인구 수집 실패'; echo '```'; tail -n 20 livepop.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 바뀐 데이터 커밋
        if: steps.key.outputs.present == 'true'
        run: |
          git add data/gileum2.json data/datasets.json
          for f in data/gileum2-population.json data/gileum2-livepop.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "데이터 변화 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Gileum 2-dong store and population snapshots"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
